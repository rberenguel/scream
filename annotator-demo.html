<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annotator Demo</title>
<style>
*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  background: #111;
  color: #d4d4d4;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

@font-face {
  font-family: 'OstrichSans';
  src: url('./fonts/OstrichSans-Heavy.otf') format('opentype');
  font-weight: 900;
}

#slide {
  position: fixed;
  inset: 3rem;
  background: #1a1a1a;
  border: 1px solid #434c5e;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 1rem;
  box-shadow: 0 6px 30px rgba(0,0,0,0.6);
}

.slide-title {
  font-family: 'OstrichSans', sans-serif;
  font-size: clamp(2rem, 8vw, 6rem);
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #bf616a;
  text-align: center;
}

.slide-sub {
  font-size: 0.85rem;
  color: #555;
  text-align: center;
  max-width: 40ch;
  line-height: 1.6;
}

#anno-svg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 100;
  overflow: visible;
}

body.draw-mode #anno-svg {
  pointer-events: all;
  cursor: crosshair;
}

#blackout {
  display: none;
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 90;
}

body.blackout-on #blackout { display: block; }

#draw-indicator {
  position: fixed;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: transparent;
  user-select: none;
  pointer-events: none;
  z-index: 200;
  white-space: nowrap;
  transition: color 0.2s;
}

body.draw-mode #draw-indicator { color: #bf616a; }

#hint {
  position: fixed;
  bottom: 6px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: #2a2a2a;
  user-select: none;
  pointer-events: none;
  white-space: nowrap;
}
</style>
</head>
<body>

<div id="slide">
  <div class="slide-title">Annotator Demo</div>
  <div class="slide-sub">Press D to enter draw mode. Tools: A arrow · R rect · E ellipse · H highlight · T text · I interact · F fill · C color · B blackout · X clear</div>
</div>

<svg id="anno-svg" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="blackout"></div>
<div id="draw-indicator"></div>
<div id="hint">D draw &middot; B blackout</div>

<script src="js/annotator.js"></script>
</body>
</html>
